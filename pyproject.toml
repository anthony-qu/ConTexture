[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
contexture = "contexture.cli:main"

[tool.setuptools]
packages = ["contexture", "contexture.webui"]

[tool.setuptools.package-data]
# The prompts, the skills and the page files are read from inside the installed package.
contexture = ["prompts/**/*", "skills/**/*", "webui/static/*"]
