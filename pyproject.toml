[project]
name = "contexture"
version = "0.1.0"
description = "An autonomous agent for spatial multi-omics analysis."
readme = "README.md"
# Python and every direct dependency are pinned to the exact versions ConTexture was tested
# with. The agent writes its own code against these libraries, so a newer release can change
# its behaviour without any error. Change a pin deliberately, and test, when upgrading.
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai==2.37.0",         # pinned although indirect: a major version change
    "openai-agents==0.17.3",
    "litellm==1.85.1",
    "python-dotenv==1.2.2",
    "scanpy==1.12.1",
    "anndata==0.12.16",
    "leidenalg==0.11.0",
    "python-igraph==1.0.0",
    "matplotlib==3.10.9",
    "squidpy==1.8.1",
    "muon==0.1.7",
    "harmonypy==2.0.0",
    "pydeseq2==0.5.4",
    "scrublet==0.2.3",
    "scFates==1.2.4",
    "monocle==0.42",

    # --- the local web page (serve.py) ------------------------------------------
    # All three were already installed as dependencies of other packages; they are
    # declared so that a future release of those packages cannot drop them silently.
    "starlette==1.0.0",
    "uvicorn==0.47.0",
    "markdown-it-py==4.2.0",

    # --- further analysis packages the agent may call ----------------------------
    # The agent writes its own code, so anything it may import must be installed here.
    "gseapy==1.3.1",           # gene-set enrichment / over-representation
    "decoupler==2.2.0",        # pathway + TF activity inference
    "scanorama==1.7.4",        # batch integration
    "mofapy2==0.7.4",          # multi-omics factor analysis
    "scvelo==0.3.4",           # RNA velocity
    "scikit-bio==0.7.3",       # ecology / diversity metrics (microbiome tasks)
    "liana==1.8.1",            # ligand-receptor / cell-cell communication
    "lifelines==0.30.3",       # survival analysis
    "gprofiler-official==1.0.0", # functional enrichment via g:Profiler
    "geoparse==2.0.4",         # GEO series/matrix parsing
    "openpyxl==3.1.5",         # .xlsx inputs (many benchmark tasks ship spreadsheets)
    "xlrd==2.0.2",             # legacy .xls inputs
    "biom-format==2.1.17",      # BIOM microbiome tables
    "pysal==26.1",             # spatial statistics
    "pot==0.9.7",              # optimal transport
    "karateclub==1.2.2",       # graph embeddings

    # --- indirect, but the numbers depend on them ---------------------------------
    # Installed through the packages above; pinned so that everyone computes with the
    # same numerical libraries and reads and writes the same file formats.
    "mudata==0.3.8",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "numba==0.65.1",
    "llvmlite==0.47.0",
    "h5py==3.16.0",
    "statsmodels==0.14.6",
    "umap-learn==0.5.12",
    "pynndescent==0.6.0",
    "networkx==3.6.1",
    "zarr==3.2.1",
    "dask==2026.1.1",
    "igraph==1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
contexture = "contexture.cli:main"

[tool.setuptools]
packages = ["contexture", "contexture.webui"]

[tool.setuptools.package-data]
# The prompts, the skills and the page files are read from inside the installed package.
contexture = ["prompts/**/*", "skills/**/*", "webui/static/*"]
